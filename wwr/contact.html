<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Rapids Rush Rafting for information about rafting adventures, reservations, and other questions.">

    <meta name="author" content="Akpo Margaret">

    <title>Contact Us | Rapids Rush Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Rapids Rush Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Rapids Rush Rafting</h1>

            <p>
                <strong>123 Main River Street</strong><br>
                <strong>Kolob, California</strong><br>
                <strong>+1 999 999 9999</strong><br>
                <strong>info@whitewater.com</strong>
            </p>
        </section>

        <section class="contact-section">

            <div class="map-container">
                <iframe src="https://www.google.com/maps?q=Kolob+Canyons,+Utah&output=embed"
                  title="Map showing the location of Rapids Rush Rafting" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="message-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..."
                      required></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg" alt="Rapids Rush Rafting employee">
                    <figcaption>Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Rapids Rush Rafting employee">
                    <figcaption>Customer Service Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Rapids Rush Rafting employee">
                    <figcaption>Adventure Coordinator</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rapids Rush Rafting | Akpo Margaret</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
